name: Deploy

# Publishes the static export to Hostinger over SSH (rsync).
#
# Rather than re-running lint/typecheck/build here, this waits for the CI
# workflow to finish on main and only proceeds if it passed — so a red build
# can never reach production, and the checks aren't paid for twice.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would change without uploading or deleting anything"
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a deploy in flight: interrupting a partial sync would leave
# public_html serving a mix of old and new files.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch is a manual escape hatch; the workflow_run path requires
    # CI to have actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run does not check out the commit that triggered CI by
          # default — pin to it so we deploy exactly what was verified.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # Sentry's `setCommits: { auto: true }` walks back from HEAD to work
          # out which commits belong to this release. A shallow clone gives it
          # nothing to walk, so the release lands with no commits attached and
          # `Fixes ISSUE-ID` never resolves anything.
          fetch-depth: 0

      - name: Fail early if SSH secrets are missing
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$SSH_HOST" ]        || missing="$missing SSH_HOST"
          [ -n "$SSH_PORT" ]        || missing="$missing SSH_PORT"
          [ -n "$SSH_USER" ]        || missing="$missing SSH_USER"
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$SSH_KNOWN_HOSTS" ] || missing="$missing SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Host/port/user come from hPanel -> Advanced -> SSH Access."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Without this the Sentry webpack plugin silently skips release
          # creation and source map upload. That is why no release existed for
          # any commit after 2026-08-27 and every `Fixes ISSUE-ID` trailer was
          # inert. Only the deploy builds a release — CI builds the same code
          # but never ships it, so it must not mint releases.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Name the release after the commit we actually checked out and are
          # about to publish. The plugin's own detection reads GITHUB_SHA
          # first, and on a `workflow_run` trigger that is the default
          # branch's head when the event fired — not workflow_run.head_sha.
          # With two merges landing close together those differ, and the
          # release would be filed against code this job never built.
          SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            # A dry run publishes nothing, so it must not create or finalize a
            # release or upload source maps. Without the token the plugin
            # skips all of that, which is exactly the behaviour we want here.
            echo "dry run — clearing SENTRY_AUTH_TOKEN so this build cannot mint a release"
            unset SENTRY_AUTH_TOKEN
          elif [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not set — this build will not create a Sentry release, so issues referenced by 'Fixes ISSUE-ID' will not auto-resolve."
          fi
          npm run build

      - name: Sanity-check the export before publishing
        run: |
          test -f out/index.html || { echo "out/index.html missing — refusing to deploy"; exit 1; }
          grep -q '_next/static' out/index.html || { echo "out/index.html has no asset references — refusing to deploy"; exit 1; }
          echo "export looks sane: $(find out -type f | wc -l | tr -d ' ') files"

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # The host key is PINNED, not discovered.
          #
          # This used to be `ssh-keyscan` at deploy time, which trusted
          # whatever answered on the day. That cost us both ways: a transient
          # failure to reach the host killed the whole deploy (run
          # 34724880848, 2026-09-12), and an impostor answering at the wrong
          # moment would have been accepted in silence. A pinned key removes
          # the network dependency and the trust-on-first-use window at once.
          #
          # Rotating the server's host key is now a deliberate act: the deploy
          # fails loudly and SSH_KNOWN_HOSTS must be re-verified and re-set.
          # That is the intended behaviour — a host key that changes without
          # anyone noticing is the thing pinning exists to prevent.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # ssh looks a host up as `[host]:port` whenever the port is not 22.
          # A pinned bare `host` line parses fine and matches nothing, failing
          # later at connect time with a much less obvious error, so check the
          # lookup here where the message can say what to do about it.
          if [ "$SSH_PORT" = "22" ]; then spec="$SSH_HOST"; else spec="[$SSH_HOST]:$SSH_PORT"; fi
          if ! ssh-keygen -F "$spec" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "SSH_KNOWN_HOSTS contains no entry matching $spec."
            echo
            echo "Regenerate it locally with:"
            echo "    ssh-keyscan -p <port> <host>"
            echo "verify the fingerprint against hPanel, then:"
            echo "    gh secret set SSH_KNOWN_HOSTS < known_hosts.txt"
            exit 1
          fi
          echo "pinned host key in use:"
          ssh-keygen -l -F "$spec" -f ~/.ssh/known_hosts

      - name: Confirm the remote target is the live site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET_DIR: domains/chetcarter.com/public_html
        run: |
          # rsync happily creates a missing destination, so a wrong path would
          # deploy into a new empty directory and report success while the site
          # never changed. Refuse to run unless the target already exists and
          # already looks like this site.
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "
              test -d '$TARGET_DIR' || { echo 'target $TARGET_DIR does not exist'; exit 1; }
              test -f '$TARGET_DIR/index.html' || { echo 'no index.html in $TARGET_DIR — refusing to treat it as the web root'; exit 1; }
              echo \"target ok: \$(find '$TARGET_DIR' -type f | wc -l | tr -d ' ') files currently deployed\"
            "

      - name: Record when the upload started
        run: echo "DEPLOY_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Publish to Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DRY_RUN: ${{ inputs.dry_run }}
          # SSH lands in /home/<user>, where public_html does NOT exist — the
          # web root is under domains/<domain>/. Getting this wrong deploys into
          # a new empty directory and silently changes nothing; the step above
          # guards against that.
          TARGET_DIR: domains/chetcarter.com/public_html
        run: |
          # --delete prunes assets that a later build no longer ships, which is
          # what stops public_html accumulating dead files. Everything listed as
          # --exclude is skipped on upload AND protected from that pruning:
          #   .well-known      ACME/SSL challenge files — deleting breaks renewal
          #   .htaccess        server config, not part of the build
          #   _next.7927       kept rollback copy of the previous build
          #   default.php.zip  Hostinger's own file, predates this repo
          # --delete-after rather than plain --delete (which defaults to
          # --delete-during): every deploy replaces the previous build's hashed
          # chunks, so deleting as we go would remove old chunks while new ones
          # are still uploading. A visitor holding cached HTML that references
          # the old filenames would 404 for those seconds. Deleting only after
          # all transfers finish keeps both builds present during the window.
          RSYNC_FLAGS="-az --delete-after --human-readable --stats"
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — nothing will be uploaded or deleted"
            RSYNC_FLAGS="$RSYNC_FLAGS --dry-run --itemize-changes"
          fi
          rsync $RSYNC_FLAGS \
            --exclude '.well-known' \
            --exclude '.htaccess' \
            --exclude '_next.7927' \
            --exclude 'default.php.zip' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            out/ "$SSH_USER@$SSH_HOST:$TARGET_DIR/"

      - name: Verify the deploy landed
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_DIR: domains/chetcarter.com/public_html
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run — nothing was uploaded, nothing to verify"
            exit 0
          fi
          # Compare what we built against what is actually on the server.
          # This replaces an HTTP probe that curled the public URL: Hostinger's
          # CDN answers GitHub runner IPs with 403 whatever the site's health,
          # so that check could not tell a broken deploy from a bot filter — it
          # failed the deploy of 2c5d865 while the site served 200 to browsers
          # the whole time. Checksums over the same SSH connection that did the
          # upload are immune to anything the CDN decides about CI traffic.
          # Don't depend on one binary name existing on the host. The earlier
          # remote check only ever proved test/find/wc are there; a host
          # without coreutils' sha256sum would fail this step *after* a
          # successful upload, which is the same false-red this step exists to
          # remove — just moved from the CDN to the remote toolchain.
          sum_cmd='if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi'
          if command -v sha256sum >/dev/null 2>&1; then
            local_sum=$(sha256sum out/index.html | cut -d' ' -f1)
          else
            local_sum=$(shasum -a 256 out/index.html | cut -d' ' -f1)
          fi
          # `|| true` so a failed ssh or a missing hashing tool reaches the
          # guard below with an explanation, instead of errexit killing the
          # step on the assignment and leaving a bare non-zero ssh exit.
          remote=$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "sh -c '$sum_cmd' _ '$TARGET_DIR/index.html' | cut -d' ' -f1") || true
          remote_sum=$(echo "$remote" | sed -n 1p | tr -d '[:space:]')
          echo "  index.html  local=$local_sum"
          echo "              remote=$remote_sum"
          [ -n "$remote_sum" ] || {
            echo "could not hash index.html on the server (ssh failed, or neither sha256sum nor shasum is available there)"
            exit 1
          }
          [ "$local_sum" = "$remote_sum" ] || { echo "index.html on the server does not match this build"; exit 1; }

      - name: Record the deploy in Sentry
        if: ${{ inputs.dry_run != true }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # Deliberately here rather than via the plugin's `release.deploy`
          # option, which fires during the build — that would mark the release
          # deployed before rsync had even run, and would still say so if the
          # upload then failed. This step sits after the checksum verification,
          # so a deploy is only recorded once the bytes are provably on the
          # server. Same reasoning as replacing the old HTTP check: never
          # record a success we have not actually confirmed.
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not set — skipping Sentry deploy tracking."
            exit 0
          fi
          # Read the slugs from the same module next.config.mjs uses, rather
          # than keeping a second copy here. A rename that updated only one
          # would point this at a dead project, and because the call below
          # degrades failures to a warning it would go green forever while
          # recording nothing.
          # @sentry/cli is a direct devDependency, so a missing binary here is
          # a broken install rather than an upstream dependency shuffle. Say so
          # distinctly: an ::error:: annotation stands out from the transient
          # API failures below, without failing a deploy whose files are
          # already verified on the server.
          if ! npx --no-install sentry-cli --version >/dev/null 2>&1; then
            echo "::error::sentry-cli is not available — deploy tracking skipped. @sentry/cli is a declared devDependency, so check that npm ci installed it."
            exit 0
          fi
          SENTRY_ORG=$(node --input-type=module -e "process.stdout.write((await import('./sentry.shared.mjs')).SENTRY_ORG)")
          SENTRY_PROJECT=$(node --input-type=module -e "process.stdout.write((await import('./sentry.shared.mjs')).SENTRY_PROJECT)")
          export SENTRY_ORG SENTRY_PROJECT
          echo "  org=$SENTRY_ORG project=$SENTRY_PROJECT"
          npx --no-install sentry-cli releases deploys "$SENTRY_RELEASE" new \
            --env production \
            --name "chetcarter.com" \
            --url "https://chetcarter.com/" \
            --started "${DEPLOY_STARTED:-$(date +%s)}" \
            --finished "$(date +%s)" \
          || echo "::warning::Could not record the deploy in Sentry. The deploy itself succeeded — this is bookkeeping only."

      - name: Probe the live site (informational)
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        run: |
          # Deliberately not a gate. The CDN blocks CI egress, so a non-200
          # here says nothing about what browsers get — the checksum step above
          # is what proves the deploy worked. Logged because when it does
          # answer, it is a free end-to-end signal.
          for path in "" p1.webp; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'Mozilla/5.0 (compatible; chetcarter-deploy-check/1.0)' \
              "https://chetcarter.com/$path" --max-time 25 || echo 000)
            echo "  /$path -> $code"
          done
          echo "note: 403 from a GitHub runner is expected CDN behaviour, not a deploy failure"

      - name: Remove the deploy key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
