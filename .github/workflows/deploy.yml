name: Deploy

# Publishes the static export to Hostinger.
#
# Rather than re-running lint/typecheck/build here, this waits for the CI
# workflow to finish on main and only proceeds if it passed — so a red build
# can never reach production, and the checks aren't paid for twice.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy in flight: interrupting a partial upload would leave
# public_html serving a mix of old and new files.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch is a manual escape hatch; the workflow_run path requires
    # CI to have actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run does not check out the commit that triggered CI by
          # default — pin to it so we deploy exactly what was verified.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Fail early if FTP secrets are missing
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$FTP_SERVER" ]   || missing="$missing FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Values come from hPanel -> Files -> FTP Accounts."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Sanity-check the export before publishing
        run: |
          test -f out/index.html || { echo "out/index.html missing — refusing to deploy"; exit 1; }
          grep -q '_next/static' out/index.html || { echo "out/index.html has no asset references — refusing to deploy"; exit 1; }
          echo "export looks sane: $(find out -type f | wc -l | tr -d ' ') files"

      - name: Publish to Hostinger over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Hostinger supports explicit FTPS on port 21. Switch to `ftp` only if
          # the connection is rejected — that sends the password in the clear.
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: public_html/
          # The action tracks what it uploaded in a state file on the server, so
          # assets dropped from a later build get removed automatically. Files it
          # has never uploaded are left alone, which is what protects the
          # _next.7927 rollback copy and Hostinger's own default.php.zip.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
